{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h2>Zonas disponibles</h2>
  <table>
    <thead><tr><th>Nombre</th><th>Ubicacion</th><th>Capacidad</th><th>Margen</th></tr></thead>
    <tbody>
      {% for zone in zones %}
      <tr><td>{{ zone.nombre }}</td><td>{{ zone.ubicacion }}</td><td>{{ zone.capacidad }}</td><td>{{ zone.margen_operativo_minutos }} min</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
