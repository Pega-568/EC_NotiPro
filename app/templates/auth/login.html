{% extends "base.html" %}
{% block content %}
<section class="panel" style="max-width: 460px; margin: 2rem auto;">
  <h2>Ingreso seguro</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <div class="row">
      <label>Correo
        <input type="email" name="correo" required>
      </label>
      <label>Contrasena
        <input type="password" name="password" required>
      </label>
    </div>
    <button type="submit" style="margin-top: 1rem;">Entrar</button>
  </form>
</section>
{% endblock %}
