{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h2>Configuracion</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ request.cookies.get('csrf_token', '') }}">
    <table>
      <thead><tr><th>Clave</th><th>Valor</th><th>Descripcion</th></tr></thead>
      <tbody>
        {% for item in items %}
        <tr>
          <td>{{ item.clave }}</td>
          <td><input type="text" name="{{ item.clave }}" value="{{ item.valor }}"></td>
          <td>{{ item.descripcion or "-" }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <button type="submit" style="margin-top: 1rem;">Guardar configuracion</button>
  </form>
</section>
{% endblock %}
